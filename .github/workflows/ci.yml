name: CI

# Same checks as .gitlab-ci.yml, so that pull requests get feedback on GitHub.
# On main and on version tags, the production images are then published.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

# A new commit on a pull request cancels the run of the previous one
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Keep in line with .gitlab-ci.yml and the base images of the Dockerfiles
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"
  RUFF_VERSION: "0.14.10"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: maestro
          POSTGRES_PASSWORD: maestro
          POSTGRES_DB: maestro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maestro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The tests create and use maestro_test_<worker> on this server (see backend/tests/conftest.py)
      DATABASE_URL: postgresql+psycopg://maestro:maestro@localhost:5432/maestro
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uvx ruff@${RUFF_VERSION} check .
      # The migrations must build the schema from scratch and cover every table change
      - run: uv run --frozen alembic upgrade head
      - run: uv run --frozen alembic check
      # One database per worker; capped so that a big runner does not open dozens
      - run: uv run --frozen pytest -q -n auto --maxprocesses=4

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # Reads the pnpm version from "packageManager" in package.json
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Public images on ghcr.io, pulled by the server (deploy/docker-compose.yml).
  # Tags: main, sha-<full commit> (what the deploy job of the GitLab CI asks
  # for) and, on a version tag, 1.2.3, 1.2, 1 and latest.
  images:
    if: github.event_name == 'push'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/irit-kosmos/maestro-bench-${{ matrix.component }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
