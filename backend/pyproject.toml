[project]
name = "maestro-bench"
version = "2.0.0"
description = "Standalone experiment benchmarking platform with direct LLM provider access"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlmodel",
    "pydantic",
    "pandas",
    "python-dotenv",
    "jinja2",
    "pyyaml",
    "litellm",
    "numpy",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE", "DTZ", "EXE", "TRY002"]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
