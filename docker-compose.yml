services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.local
    ports:
      - "3000:3000"
    environment:
      # URL the browser uses to reach the backend
      - NUXT_PUBLIC_BACK_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - maestro-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:8000"
    env_file:
      # LLM provider API keys; copy backend/.env.example to backend/.env
      - path: ./backend/.env
        required: false
    extra_hosts:
      # Reach an Ollama running on the host (OLLAMA_API_BASE=http://host.docker.internal:11434)
      - "host.docker.internal:host-gateway"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DATABASE_URL=sqlite:///./app.db
      - CORS_ORIGINS=http://localhost:3000
    volumes:
      - ./backend:/app
      - ./datasets:/datasets
    networks:
      - maestro-network
    command: ["uv", "run", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

networks:
  maestro-network:
    driver: bridge
