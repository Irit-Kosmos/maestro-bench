services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.local
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    networks:
      - maestro-network
  redis:
    image: redis:7
    restart: always
    ports:
      - "6380:6379"
    networks:
      - maestro-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MAESTRO_API_BASE_URL=http://host.docker.internal:8001
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DATABASE_URL=sqlite:///./app.db
    volumes:
      - ./backend:/app
      - ./datasets:/app/datasets
    depends_on:
      - redis
    networks:
      - maestro-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MAESTRO_API_BASE_URL=http://host.docker.internal:8001
      - DATABASE_URL=sqlite:///./app.db
    volumes:
      - ./backend:/app
      - ./datasets:/app/datasets
    depends_on:
      - redis
    networks:
      - maestro-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "worker.py"]

networks:
  maestro-network:
    driver: bridge