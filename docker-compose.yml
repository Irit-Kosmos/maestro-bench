services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.local
    ports:
      - "3000:3000"
    environment:
      # URL the browser uses to reach the backend
      - NUXT_PUBLIC_BACK_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - maestro-network

  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      - POSTGRES_USER=maestro
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-maestro}
      - POSTGRES_DB=maestro
    ports:
      # Localhost only: for psql / GUI clients during development
      - "127.0.0.1:5432:5432"
    volumes:
      - maestro-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maestro -d maestro"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - maestro-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:8000"
    env_file:
      # LLM provider API keys; copy backend/.env.example to backend/.env
      - path: ./backend/.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      # Reach an Ollama running on the host (OLLAMA_API_BASE=http://host.docker.internal:11434)
      - "host.docker.internal:host-gateway"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DATABASE_URL=postgresql+psycopg://maestro:${POSTGRES_PASSWORD:-maestro}@postgres:5432/maestro
      - CORS_ORIGINS=http://localhost:3000
    volumes:
      - ./backend:/app
      - ./datasets:/datasets
    networks:
      - maestro-network
    command: ["uv", "run", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

networks:
  maestro-network:
    driver: bridge
volumes:
  maestro-pgdata:

