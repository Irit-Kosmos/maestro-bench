# Apache site in front of deploy/docker-compose.yml, to install as
# /etc/apache2/sites-available/maestro-bench.conf (needs proxy and proxy_http).
# HTTPS ends before this server: it receives plain HTTP on port 80.
#
#   /api/...  the backend, without the /api prefix (PUBLIC_API_URL ends in /api)
#   /...      the frontend
<VirtualHost *:80>
    ProxyRequests Off

    # The backend streams the progress of running experiments (server-sent
    # events): pass every chunk on at once and keep the stream open
    ProxyPass        /api/ http://127.0.0.1:8000/ flushpackets=on timeout=3600
    ProxyPassReverse /api/ http://127.0.0.1:8000/

    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/maestro-bench-error.log
    CustomLog ${APACHE_LOG_DIR}/maestro-bench-access.log combined
</VirtualHost>
