[project]
name = "maestro-bench"
version = "2.0.0"
description = "Standalone experiment benchmarking platform with direct LLM provider access"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135",
    "uvicorn[standard]",
    "sqlmodel",
    "pydantic",
    "pandas",
    "python-dotenv",
    "jinja2",
    "pyyaml",
    "litellm",
    "numpy",
    "alembic>=1.20.0",
    "psycopg[binary]>=3.3.6",
    "authlib>=1.8.0",
    "itsdangerous>=2.2.0",
    "httpx>=0.28.1",
    "cryptography>=46",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE", "DTZ", "EXE", "TRY002"]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
