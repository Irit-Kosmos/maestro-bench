# One click in the pipeline of main: the server pulls the images of this commit,
# built and published by the GitHub CI, and restarts the stack
# (.config/ansible/update.yaml). Running it again from an older pipeline rolls
# back to that commit. Too early, before GitHub has published the images, it
# fails without touching the running version.
deploy-production:
  stage: deploy
  image: alpine:latest
  environment: Production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - when: never
  manual_confirmation: 'Deploy the current version of main to production?'
  interruptible: false
  before_script:
    - mkdir -p ~/.ssh
    - apk add ansible openssh
    - echo "-----BEGIN OPENSSH PRIVATE KEY-----" > ~/.ssh/id_ed25519
    - echo "$SSH_PRIVATE_KEY"                   >> ~/.ssh/id_ed25519
    - echo "-----END OPENSSH PRIVATE KEY-----"  >> ~/.ssh/id_ed25519
    - echo "$SSH_HOST $SSH_PINNED_HOST_KEY"      > ~/.ssh/known_hosts
    - chmod 700 ~/.ssh
    - chmod 600 ~/.ssh/id_ed25519
  script:
    - ansible-playbook -i .config/ansible/hosts.yaml .config/ansible/update.yaml -e "mb_tag=sha-${CI_COMMIT_SHA}"
